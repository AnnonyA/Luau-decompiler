name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test benchmark harness
        run: npm run bench:test
      - name: Smoke-test local benchmark
        run: npm run bench:compare -- --output "$RUNNER_TEMP/luau-baseline.json"
      - name: Summarize benchmark in job report
        run: node scripts/bench-summary.mjs "$RUNNER_TEMP/luau-baseline.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measured benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: luau-baseline-node-${{ matrix.node }}
          path: ${{ runner.temp }}/luau-baseline.json
          if-no-files-found: error
          retention-days: 30
