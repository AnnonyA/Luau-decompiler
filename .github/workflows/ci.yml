name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test benchmark harness
        run: npm run bench:test
      - name: Smoke-test local benchmark
        run: npm run bench:compare -- --output "$RUNNER_TEMP/luau-baseline.json"
