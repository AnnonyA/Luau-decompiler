name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test benchmark harness
        run: npm run bench:test
      - name: Smoke-test local benchmark
        run: npm run bench:compare -- --output "$RUNNER_TEMP/luau-baseline.json"
      - name: Summarize benchmark in job report
        run: node scripts/bench-summary.mjs "$RUNNER_TEMP/luau-baseline.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measured benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: luau-baseline-node-${{ matrix.node }}
          path: ${{ runner.temp }}/luau-baseline.json
          if-no-files-found: error
          retention-days: 30
      - name: Fetch pinned LunaUX public corpus
        shell: bash
        run: |
          git init "$RUNNER_TEMP/lunaux-corpus"
          git -C "$RUNNER_TEMP/lunaux-corpus" remote add origin https://github.com/boydev-1444/lunaux-decompiler.git
          git -C "$RUNNER_TEMP/lunaux-corpus" fetch --depth 1 origin 910ccd4d546fd0c8e21f770a30732ae246eab5c5
          git -C "$RUNNER_TEMP/lunaux-corpus" checkout --detach FETCH_HEAD
      - name: Compare against pinned 22 public fixtures
        run: |
          npm run bench:compare -- \
            --lunaux-dir "$RUNNER_TEMP/lunaux-corpus" \
            --require-lunaux-count 22 \
            --output "$RUNNER_TEMP/luau-shared-baseline.json"
          node scripts/bench-summary.mjs "$RUNNER_TEMP/luau-shared-baseline.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measured shared-corpus JSON
        uses: actions/upload-artifact@v4
        with:
          name: luau-shared-corpus-node-${{ matrix.node }}
          path: ${{ runner.temp }}/luau-shared-baseline.json
          if-no-files-found: error
          retention-days: 30

  syntax:
    name: Parse source with official pinned Luau
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out our decompiler
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build our decompiler
        run: |
          npm ci
          npm run build
      - name: Fetch pinned official Luau compiler
        shell: bash
        run: |
          git init "$RUNNER_TEMP/luau-source"
          git -C "$RUNNER_TEMP/luau-source" remote add origin https://github.com/luau-lang/luau.git
          git -C "$RUNNER_TEMP/luau-source" fetch --depth 1 origin 9d7748a4f324213a18cb8283fa2a77c330225fa0
          git -C "$RUNNER_TEMP/luau-source" checkout --detach FETCH_HEAD
      - name: Build official syntax checker
        shell: bash
        run: |
          cmake -S "$RUNNER_TEMP/luau-source" -B "$RUNNER_TEMP/luau-build" \
            -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/luau-build" --target Luau.Compile.CLI Luau.Repl.CLI --parallel 2
          "$RUNNER_TEMP/luau-build/luau-compile" --help | grep -F -- "--only-parse"
      - name: Fetch pinned LunaUX public fixture corpus
        shell: bash
        run: |
          git init "$RUNNER_TEMP/lunaux-corpus"
          git -C "$RUNNER_TEMP/lunaux-corpus" remote add origin https://github.com/boydev-1444/lunaux-decompiler.git
          git -C "$RUNNER_TEMP/lunaux-corpus" fetch --depth 1 origin 910ccd4d546fd0c8e21f770a30732ae246eab5c5
          git -C "$RUNNER_TEMP/lunaux-corpus" checkout --detach FETCH_HEAD
      - name: Check our output and published references with official parser
        shell: bash
        run: |
          npm run bench:compare -- \
            --lunaux-dir "$RUNNER_TEMP/lunaux-corpus" \
            --require-lunaux-count 22 \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --source-dir "$RUNNER_TEMP/generated-source" \
            --output "$RUNNER_TEMP/luau-syntax-report.json"
          node scripts/bench-summary.mjs "$RUNNER_TEMP/luau-syntax-report.json" >> "$GITHUB_STEP_SUMMARY"
          node scripts/bench-assert-syntax.mjs "$RUNNER_TEMP/luau-syntax-report.json" --require-all-pass
      - name: Compare behavior of controlled original and decompiled Luau
        shell: bash
        run: |
          npm run bench:semantic -- \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/luau-semantic-report.json"
      - name: Upload controlled execution comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-controlled-semantic-report
          path: ${{ runner.temp }}/luau-semantic-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check 12 independent originals against the official VM
        run: |
          npm run bench:competition -- \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/competition" \
            --require-local-match
      - name: Check scope, register and CFG regressions with extra inputs
        run: |
          npm run bench:regressions -- \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/pr58-regressions"
      - name: Upload regression traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-scope-register-regressions
          path: ${{ runner.temp }}/pr58-regressions
          if-no-files-found: warn
          retention-days: 30
      - name: Upload original-source comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-original-source-comparison
          path: ${{ runner.temp }}/competition
          if-no-files-found: warn
          retention-days: 30
      - name: Upload generated Luau for parse-error triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-generated-source
          path: ${{ runner.temp }}/generated-source/*.luau
          if-no-files-found: warn
          retention-days: 14
      - name: Upload official parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-official-parser-results
          path: ${{ runner.temp }}/luau-syntax-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check reduced large-system regressions in the official VM
        run: |
          npm run bench:large:regressions -- --name-styles \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/large-regressions"
      - name: Check sealed large development systems
        run: |
          npm run bench:large -- \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/large-development" --require-local-match
          node scripts/large/freeze-engine.mjs "$RUNNER_TEMP/large-development/report.json" "$RUNNER_TEMP/large-freeze.json"
      - name: Check observed large regressions without external requests
        run: |
          npm run bench:large -- \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/large-holdout" --partition observed --require-local-match
      - name: Upload large-system evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-large-system-evidence
          path: |
            ${{ runner.temp }}/large-development
            ${{ runner.temp }}/large-holdout
            ${{ runner.temp }}/large-regressions
            ${{ runner.temp }}/large-freeze.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check sealed second-cohort development systems
        run: |
          npm run bench:large -- \
            --manifest benchmarks/large/cohort2/manifest.json \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/cohort2-development" --require-local-match
      - name: Check observed second-cohort regressions
        if: always()
        run: |
          npm run bench:large -- \
            --manifest benchmarks/large/cohort2/manifest.json --partition observed \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" \
            --output "$RUNNER_TEMP/cohort2-holdout" --require-local-match
      - name: Upload second-cohort evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-cohort2-evidence
          path: |
            ${{ runner.temp }}/cohort2-development
            ${{ runner.temp }}/cohort2-holdout
          if-no-files-found: warn
          retention-days: 30
      - name: Check seeded captures, effects and multiple returns
        run: |
          npm run bench:fuzz -- --count 6 --reduce-attempts 12 \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" --output "$RUNNER_TEMP/semantic-fuzz"
      - name: Upload generated semantic observations and reductions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-semantic-fuzz
          path: ${{ runner.temp }}/semantic-fuzz
          if-no-files-found: warn
          retention-days: 30
      - name: Check sealed independent systems now tracked as regressions
        run: |
          npm run bench:independent -- \
            --luau-compile "$RUNNER_TEMP/luau-build/luau-compile" \
            --luau "$RUNNER_TEMP/luau-build/luau" --output "$RUNNER_TEMP/independent-regressions"
      - name: Upload independent regression observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luau-independent-regressions
          path: ${{ runner.temp }}/independent-regressions
          if-no-files-found: warn
          retention-days: 30
